<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#2d2d2d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF4500"/>
      <stop offset="100%" style="stop-color:#E63E00"/>
    </linearGradient>
    <linearGradient id="glow" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" style="stop-color:#FF4500;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#FF4500;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Accent glow bottom -->
  <rect x="0" y="450" width="1200" height="225" fill="url(#glow)"/>

  <!-- Grid pattern -->
  <g opacity="0.04" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="675"/>
    <line x1="400" y1="0" x2="400" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="800" y1="0" x2="800" y2="675"/>
    <line x1="1000" y1="0" x2="1000" y2="675"/>
  </g>

  <!-- Camera icon abstract -->
  <g transform="translate(860, 120)" opacity="0.08">
    <rect x="0" y="20" width="220" height="160" rx="16" fill="none" stroke="#FF4500" stroke-width="3"/>
    <circle cx="110" cy="100" r="50" fill="none" stroke="#FF4500" stroke-width="3"/>
    <circle cx="110" cy="100" r="20" fill="#FF4500" opacity="0.3"/>
    <rect x="80" y="0" width="60" height="25" rx="8" fill="#FF4500"/>
    <circle cx="180" cy="60" r="12" fill="#FF4500" opacity="0.5"/>
  </g>

  <!-- Shopping cart abstract -->
  <g transform="translate(60, 380)" opacity="0.06">
    <rect x="0" y="30" width="100" height="120" rx="8" fill="none" stroke="#FF4500" stroke-width="3"/>
    <path d="M10 30 L30 0 L70 0 L90 30" fill="none" stroke="#FF4500" stroke-width="3"/>
    <circle cx="30" cy="175" r="12" fill="#FF4500"/>
    <circle cx="70" cy="175" r="12" fill="#FF4500"/>
    <line x1="40" y1="80" x2="60" y2="80" stroke="#FF4500" stroke-width="2"/>
    <line x1="50" y1="70" x2="50" y2="90" stroke="#FF4500" stroke-width="2"/>
  </g>

  <!-- Monitor / screen -->
  <g transform="translate(40, 80)" opacity="0.05">
    <rect x="0" y="0" width="260" height="180" rx="10" fill="none" stroke="#FF4500" stroke-width="3"/>
    <rect x="5" y="5" width="250" height="170" rx="6" fill="none" stroke="#FF4500" stroke-width="1" opacity="0.3"/>
    <rect x="90" y="180" width="80" height="20" rx="4" fill="#FF4500"/>
    <rect x="70" y="200" width="120" height="6" rx="3" fill="#FF4500"/>
  </g>

  <!-- Main title -->
  <text x="80" y="240" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">
    Live Shopping
  </text>
  <text x="80" y="300" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#FF4500" letter-spacing="-0.5">
    Factores que determinan el presupuesto
  </text>

  <!-- Divider line -->
  <rect x="80" y="330" width="80" height="4" rx="2" fill="url(#accent)"/>

  <!-- Subtitle -->
  <text x="80" y="365" font-family="Inter, Arial, sans-serif" font-size="18" fill="#999" font-weight="400">
    Guía para retail, farmacia y marcas en Chile
  </text>

  <!-- Brand -->
  <text x="80" y="420" font-family="Inter, Arial, sans-serif" font-size="14" fill="#666" font-weight="600" letter-spacing="3">
    DAR2 · PRODUCTORA AUDIOVISUAL
  </text>

  <!-- Bottom accent bar -->
  <rect x="0" y="660" width="1200" height="15" fill="url(#accent)"/>
</svg>
